[package]
name = "starlight-catch"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bevy_app = { version = "0.16.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.16.1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = "thin"
panic = "abort"
codegen-units = 16
strip = true
