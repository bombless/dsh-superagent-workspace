name: Build and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-game-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static game
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              echo "::warning::No npm lockfile found; using npm install. Commit package-lock.json for reproducible builds."
              npm install
            fi

            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              npm run build
            else
              echo "No npm build script found; expecting a static site in the repository root."
            fi
          fi

          rm -rf site
          mkdir -p site

          if [ -d dist ]; then
            cp -a dist/. site/
          elif [ -d build ]; then
            cp -a build/. site/
          elif [ -d out ]; then
            cp -a out/. site/
          else
            echo "No dist/, build/, or out/ directory found; using root-level static files."
            rsync -a \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='node_modules/' \
              --exclude='site/' \
              --exclude='package.json' \
              --exclude='package-lock.json' \
              --exclude='npm-shrinkwrap.json' \
              --exclude='yarn.lock' \
              --exclude='pnpm-lock.yaml' \
              --exclude='README*' \
              ./ site/
          fi

          if [ ! -f site/index.html ]; then
            echo "::error::The published site must contain index.html at its root."
            exit 1
          fi

      - name: Package static site
        run: |
          cd site
          zip -qr ../site.zip .

      - name: Deploy to Caddy webhook
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::error::Repository secret DEPLOY_TOKEN is not configured."
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            -X POST 'https://bombless.duckdns.org/_deploy' \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/zip' \
            --data-binary @site.zip
