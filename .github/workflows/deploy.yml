name: Build and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-game-deploy
  cancel-in-progress: true

jobs:
  deploy:
    uses: bombless/caddy-webhook/.github/workflows/deploy-static.yml@0a50baf4db4bae815154e154346a5a8b99aa8b58
    with:
      output_dir: "."
    secrets:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
