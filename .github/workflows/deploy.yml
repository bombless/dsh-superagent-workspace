name: Build and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-game-deploy
  cancel-in-progress: true

jobs:
  deploy:
    uses: bombless/caddy-webhook/.github/workflows/deploy-static.yml@eddecc316d61c25e5a91075bb71dea7b1af8c03c
    with:
      output_dir: "."
    secrets:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
