<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小狗喂食</title>
  <style>
    :root {
      --ink: #2a2218;
      --muted: #6d5e48;
      --cream: #fff8ea;
      --gold: #e39a2b;
      --panel: rgba(255, 248, 234, 0.88);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #6f8a4e;
      color: var(--ink);
      font-family: "DejaVu Sans", "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #7ea15a;
      cursor: crosshair;
    }
    .hud {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 0 max(14px, env(safe-area-inset-left)) 0 max(14px, env(safe-area-inset-right));
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    .pill {
      background: var(--panel);
      border: 1px solid rgba(90, 64, 28, 0.14);
      border-radius: 999px;
      padding: 8px 14px;
      backdrop-filter: blur(8px);
      font-size: 15px;
      box-shadow: 0 8px 24px rgba(60, 40, 10, 0.12);
    }
    .pill strong { color: #b86a12; font-weight: 700; }
    .hint {
      position: absolute;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid rgba(90, 64, 28, 0.14);
      border-radius: 999px;
      padding: 10px 16px;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(60, 40, 10, 0.12);
    }
    h1.sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
  </style>
</head>
<body>
  <h1 class="sr">小狗喂食</h1>
  <div id="stage">
    <canvas id="game" width="960" height="640"></canvas>
    <div class="hud">
      <div class="pill">Fetched <strong id="fed">0</strong></div>
      <div class="pill">Bones <strong id="bones">0</strong></div>
    </div>
    <div class="hint" id="hint">Click the grass to toss a bone</div>
  </div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const fedEl = document.getElementById("fed");
    const bonesEl = document.getElementById("bones");
    const hintEl = document.getElementById("hint");

    const FIELD_MARGIN = 36;
    const BONE_PICKUP = 22;
    const PUPPY_SPEED = 168;

    const bones = [];
    const puppies = [];
    let fed = 0;
    let nextId = 1;
    let last = performance.now();
    const grassTufts = [];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (grassTufts.length === 0) seedGrass(w, h);
    }

    function seedGrass(w, h) {
      const count = Math.round((w * h) / 9000);
      for (let i = 0; i < count; i++) {
        grassTufts.push({
          x: Math.random() * w,
          y: Math.random() * h,
          s: 0.6 + Math.random() * 1.1,
          shade: Math.random(),
        });
      }
    }

    function fieldBounds() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      return {
        x: FIELD_MARGIN,
        y: FIELD_MARGIN + 28,
        w: Math.max(40, w - FIELD_MARGIN * 2),
        h: Math.max(40, h - FIELD_MARGIN * 2 - 48),
        viewW: w,
        viewH: h,
      };
    }

    function pointInField(x, y, field) {
      return x >= field.x && y >= field.y && x <= field.x + field.w && y <= field.y + field.h;
    }

    function spawnPointOutside(target, field) {
      const side = Math.floor(Math.random() * 4);
      const pad = 70;
      if (side === 0) return { x: -pad, y: field.y + Math.random() * field.h, side };
      if (side === 1) return { x: field.viewW + pad, y: field.y + Math.random() * field.h, side };
      if (side === 2) return { x: field.x + Math.random() * field.w, y: -pad, side };
      return { x: field.x + Math.random() * field.w, y: field.viewH + pad, side };
    }

    function dropBone(x, y) {
      const field = fieldBounds();
      if (!pointInField(x, y, field)) return;
      const bone = {
        id: nextId++,
        x,
        y,
        claimed: false,
        taken: false,
        bob: Math.random() * Math.PI * 2,
      };
      bones.push(bone);
      const start = spawnPointOutside({ x, y }, field);
      const angle = Math.atan2(y - start.y, x - start.x);
      puppies.push({
        id: bone.id,
        boneId: bone.id,
        x: start.x,
        y: start.y,
        angle,
        state: "run",
        hold: 0,
        wag: Math.random() * Math.PI * 2,
        coat: Math.random(),
        exitX: start.x,
        exitY: start.y,
      });
      bone.claimed = true;
      updateHud();
    }

    function updateHud() {
      const live = bones.filter((b) => !b.taken).length;
      fedEl.textContent = String(fed);
      bonesEl.textContent = String(live);
      if (fed === 0 && live === 0) hintEl.textContent = "Click the grass to toss a bone";
      else if (live > 0) hintEl.textContent = "A puppy is running in for the bone";
      else hintEl.textContent = "Click again to toss another";
    }

    function step(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const field = fieldBounds();

      for (const pup of puppies) {
        pup.wag += dt * 10;
        const bone = bones.find((b) => b.id === pup.boneId);
        if (pup.state === "run" && bone && !bone.taken) {
          const dx = bone.x - pup.x;
          const dy = bone.y - pup.y;
          const dist = Math.hypot(dx, dy) || 1;
          pup.angle = Math.atan2(dy, dx);
          const stepLen = PUPPY_SPEED * dt;
          if (dist <= BONE_PICKUP) {
            bone.taken = true;
            pup.state = "hold";
            pup.hold = 0.28;
            fed += 1;
            updateHud();
          } else {
            pup.x += (dx / dist) * stepLen;
            pup.y += (dy / dist) * stepLen;
          }
        } else if (pup.state === "hold") {
          pup.hold -= dt;
          if (bone) {
            pup.x += (bone.x - pup.x) * Math.min(1, dt * 10);
            pup.y += (bone.y - pup.y) * Math.min(1, dt * 10);
          }
          if (pup.hold <= 0) {
            pup.state = "leave";
            const exit = spawnPointOutside(pup, field);
            pup.exitX = exit.x;
            pup.exitY = exit.y;
            pup.angle = Math.atan2(pup.exitY - pup.y, pup.exitX - pup.x);
          }
        } else if (pup.state === "leave") {
          const dx = pup.exitX - pup.x;
          const dy = pup.exitY - pup.y;
          const dist = Math.hypot(dx, dy) || 1;
          pup.angle = Math.atan2(dy, dx);
          const stepLen = (PUPPY_SPEED + 30) * dt;
          if (dist <= stepLen) pup.state = "gone";
          else {
            pup.x += (dx / dist) * stepLen;
            pup.y += (dy / dist) * stepLen;
          }
        }
      }

      for (let i = puppies.length - 1; i >= 0; i--) {
        if (puppies[i].state === "gone") puppies.splice(i, 1);
      }
      for (let i = bones.length - 1; i >= 0; i--) {
        const bone = bones[i];
        if (!bone.taken) bone.bob += dt * 3;
        const owner = puppies.find((p) => p.boneId === bone.id);
        if (bone.taken && !owner) bones.splice(i, 1);
      }

      draw(field);
      requestAnimationFrame(step);
    }

    function draw(field) {
      const w = field.viewW;
      const h = field.viewH;
      ctx.clearRect(0, 0, w, h);

      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#8fb56a");
      sky.addColorStop(1, "#6d944c");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      for (const tuft of grassTufts) {
        if (tuft.x > w || tuft.y > h) continue;
        ctx.save();
        ctx.translate(tuft.x, tuft.y);
        ctx.scale(tuft.s, tuft.s);
        ctx.strokeStyle = tuft.shade > 0.5 ? "rgba(70, 110, 42, 0.45)" : "rgba(214, 230, 150, 0.35)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.quadraticCurveTo(-2, -2, -5, -6);
        ctx.moveTo(0, 4);
        ctx.quadraticCurveTo(1, -3, 0, -8);
        ctx.moveTo(0, 4);
        ctx.quadraticCurveTo(3, -2, 6, -5);
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.setLineDash([6, 10]);
      ctx.lineWidth = 2;
      roundRect(ctx, field.x, field.y, field.w, field.h, 28);
      ctx.stroke();
      ctx.restore();

      for (const bone of bones) {
        if (bone.taken) continue;
        const lift = Math.sin(bone.bob) * 2;
        drawBone(bone.x, bone.y + lift);
      }

      const ordered = puppies.slice().sort((a, b) => a.y - b.y);
      for (const pup of ordered) {
        const carrying = pup.state === "hold" || pup.state === "leave";
        drawPuppy(pup, carrying);
      }
    }

    function roundRect(context, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      context.beginPath();
      context.moveTo(x + radius, y);
      context.arcTo(x + w, y, x + w, y + h, radius);
      context.arcTo(x + w, y + h, x, y + h, radius);
      context.arcTo(x, y + h, x, y, radius);
      context.arcTo(x, y, x + w, y, radius);
      context.closePath();
    }

    function drawBone(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.5);
      ctx.fillStyle = "rgba(70, 50, 20, 0.18)";
      ctx.beginPath();
      ctx.ellipse(2, 10, 16, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f4e2c4";
      ctx.strokeStyle = "#c9a57a";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(-16, -4, 32, 8, 4);
      ctx.fill();
      ctx.stroke();
      for (const [bx, by] of [[-14, -5], [-14, 5], [14, -5], [14, 5]]) {
        ctx.beginPath();
        ctx.arc(bx, by, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPuppy(pup, carrying) {
      ctx.save();
      ctx.translate(pup.x, pup.y);
      ctx.rotate(pup.angle);
      ctx.scale(1.35, 1.35);

      const cream = pup.coat > 0.55 ? "#f4d7a6" : "#e7b56c";
      const dark = pup.coat > 0.55 ? "#c17a34" : "#7d4b22";
      const ear = pup.coat > 0.55 ? "#a86428" : "#5c3418";
      const wag = Math.sin(pup.wag);

      ctx.fillStyle = "rgba(50, 40, 20, 0.16)";
      ctx.beginPath();
      ctx.ellipse(1, 4, 22, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(-20, 0);
      ctx.rotate(wag * 0.7);
      ctx.fillStyle = dark;
      ctx.beginPath();
      ctx.moveTo(2, 0);
      ctx.quadraticCurveTo(-8, -10, -16, -2);
      ctx.quadraticCurveTo(-8, 4, 2, 3);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = cream;
      ctx.beginPath();
      ctx.ellipse(-2, 0, 16, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(90, 50, 20, 0.25)";
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = dark;
      ctx.beginPath();
      ctx.ellipse(-4, 0, 8, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = cream;
      ctx.beginPath();
      ctx.arc(13, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = ear;
      ctx.beginPath();
      ctx.ellipse(8, -8, 4.2, 6.5, -0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(8, 8, 4.2, 6.5, 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f1c9a0";
      ctx.beginPath();
      ctx.ellipse(8.4, -7.4, 2, 3.4, -0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(8.4, 7.4, 2, 3.4, 0.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#2b2118";
      ctx.beginPath();
      ctx.arc(16, -3.2, 1.5, 0, Math.PI * 2);
      ctx.arc(16, 3.2, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(16.5, -3.6, 0.5, 0, Math.PI * 2);
      ctx.arc(16.5, 2.8, 0.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#3a2a22";
      ctx.beginPath();
      ctx.ellipse(22, 0, 3.1, 2.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#5c4034";
      ctx.beginPath();
      ctx.arc(23.2, -0.6, 0.7, 0, Math.PI * 2);
      ctx.arc(23.2, 0.7, 0.7, 0, Math.PI * 2);
      ctx.fill();

      const stride = wag * 3;
      ctx.fillStyle = dark;
      const paws = [[-6, -12, stride], [5, -12, -stride], [-5, 12, -stride], [6, 12, stride]];
      for (const [px, py, shift] of paws) {
        ctx.beginPath();
        ctx.ellipse(px + shift * 0.25, py, 3.4, 2.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (carrying) {
        ctx.save();
        ctx.translate(24, 0);
        ctx.rotate(Math.PI / 2);
        ctx.scale(0.5, 0.5);
        ctx.fillStyle = "#f4e2c4";
        ctx.strokeStyle = "#c9a57a";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.roundRect(-14, -3, 28, 6, 3);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(-12, 0, 4.5, 0, Math.PI * 2);
        ctx.arc(12, 0, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
    }

    canvas.addEventListener("pointerdown", (event) => {
      const rect = canvas.getBoundingClientRect();
      dropBone(event.clientX - rect.left, event.clientY - rect.top);
    });

    window.addEventListener("resize", () => {
      grassTufts.length = 0;
      resize();
    });

    resize();
    updateHud();
    requestAnimationFrame(step);
  </script>
</body>
</html>
