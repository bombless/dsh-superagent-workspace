<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pebble Match</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="board">
      <header class="hud">
        <p>Cleared <strong id="score">0</strong></p>
        <p>Best <strong id="best">0</strong></p>
        <p>Left <strong id="left">0</strong></p>
      </header>
      <h1>Pebble Match</h1>
      <p id="status" class="status">Tap two or more touching pebbles of the same color.</p>
      <div id="grid" class="grid"></div>
      <button id="restart" type="button">New board</button>
    </main>
    <script type="module" src="./game.js"></script>
  </body>
</html>
